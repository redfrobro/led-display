# LED Matrix Settings
# All values here are defaults — command-line arguments override them.

[display]
rows             = 32             # Display height in pixels
cols             = 64             # Display width in pixels
hardware_mapping = "adafruit-hat" # HAT type (adafruit-hat, regular, etc.)
parallel         = 1              # Number of parallel chains

[daemon]
duration   = 8                    # Seconds per effect (0 = forever)
frequency  = 5                    # Spawn rate for particle effects (1-10)
pause      = 0.5                  # Seconds between effects
brightness = 100                  # Initial brightness (0-100)
speed      = 1.0                  # Initial animation speed (0.1-5.0)
port       = 80                   # Web server port (80 requires sudo)
socket     = "/tmp/led-matrix.sock"

[startup]
display_duration = 15             # Seconds to show IP address on boot
font             = "4x6.bdf"      # Font used for startup IP display

# ---------------------------------------------------------------------------
# Mood Presets
# All moods are defined here — add, edit, or remove as desired.
#
# Available keys per preset:
#   hue_lock     = 0-360    Lock all hues to a single value (monochrome)
#   hue_range    = 0-180    ±degrees of variation around hue_lock
#   hue_shift    = -360-360 Rotate all hues by this many degrees
#   sat_override = 0.0-1.0  Force saturation to this value (overrides effect)
#   sat_mult     = 0.0-1.0  Multiply saturation by this factor
#   val_mult     = 0.0-1.0  Multiply brightness by this factor
# ---------------------------------------------------------------------------

[mood_presets.default]
# No transform — all effects run with their natural colors

[mood_presets.mono_red]
hue_lock     = 0
sat_override = 1.0
hue_range    = 30

[mood_presets.mono_orange]
hue_lock     = 30
sat_override = 1.0
hue_range    = 30

[mood_presets.mono_yellow]
hue_lock     = 60
sat_override = 1.0
hue_range    = 30

[mood_presets.mono_green]
hue_lock     = 120
sat_override = 1.0
hue_range    = 30

[mood_presets.mono_cyan]
hue_lock     = 180
sat_override = 1.0
hue_range    = 30

[mood_presets.mono_blue]
hue_lock     = 240
sat_override = 1.0
hue_range    = 30

[mood_presets.mono_purple]
hue_lock     = 280
sat_override = 1.0
hue_range    = 30

[mood_presets.warm]
hue_shift = -40

[mood_presets.cool]
hue_shift = 60

[mood_presets.pastel]
sat_mult = 0.4

[mood_presets.night]
sat_mult = 0.7
val_mult = 0.5

[mood_presets.grayscale]
sat_mult = 0.0